name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test --locked
      - run: uv run python scripts/generate_schemas.py --check
      - run: uv run auto-merge-agent validate-config
      - run: uv run pytest -q
